replicas: 2

image:
  repository: vllm/vllm-openai
  tag: v0.32.0

args:
  - --model
  - neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8
  - --served-model-name
  - ledgerly-support
  - --max-model-len
  - "8192"
  - --enable-prefix-caching
  - --enable-prompt-tokens-details
  - --enable-auto-tool-choice
  - --tool-call-parser
  - llama3_json
  - --api-key
  - $(VLLM_API_KEY)

env:
  - name: VLLM_API_KEY
    valueFrom:
      secretKeyRef:
        name: ledgerly-inference
        key: vllm-api-key
  - name: HF_TOKEN
    valueFrom:
      secretKeyRef:
        name: ledgerly-inference
        key: hf-token

resources:
  limits:
    nvidia.com/gpu: 1
  requests:
    cpu: "4"
    memory: 24Gi

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 120
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 300
  periodSeconds: 30

volumes:
  - name: hf-cache
    persistentVolumeClaim:
      claimName: hf-cache

volumeMounts:
  - name: hf-cache
    mountPath: /root/.cache/huggingface

service:
  port: 8000
