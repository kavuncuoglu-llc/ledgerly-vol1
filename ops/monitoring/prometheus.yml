global:
  scrape_interval: 15s

scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["vllm:8000"]

  - job_name: llama
    metrics_path: /metrics
    static_configs:
      - targets: ["llama:8080", "llama-cpu:8080"]

  - job_name: triton
    metrics_path: /metrics
    static_configs:
      - targets: ["triton:9000"]
