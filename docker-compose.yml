services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ledgerly-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ledgerly-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ledgerly-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sidecar:
    build: ./sidecar
    container_name: ledgerly-sidecar
    ports:
      - "127.0.0.1:8008:8000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

networks:
  internal:

volumes:
  ledgerly-postgres:
  ledgerly-redis:
