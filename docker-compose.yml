services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ledgerly-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ledgerly-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ledgerly-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sidecar:
    build: ./sidecar
    container_name: ledgerly-sidecar
    ports:
      - "127.0.0.1:8008:8000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  ollama:
    image: ollama/ollama:latest
    container_name: ledgerly-ollama
    profiles: ["linux-gpu"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./ops/ollama:/modelfiles:ro
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    container_name: ledgerly-ollama-init
    profiles: ["linux-gpu"]
    networks:
      - internal
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ops/ollama:/modelfiles:ro
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - sh
      - -c
      - ollama pull nomic-embed-text && ollama pull llama3.1:8b-instruct-q4_K_M && ollama create ledgerly-support -f /modelfiles/Modelfile.ledgerly-support

  llama:
    image: ledgerly/llama-server:cuda-${LLAMA_TAG:-b11988}
    build:
      context: ./ops/llama
      dockerfile: Dockerfile.cuda
      args:
        LLAMA_TAG: ${LLAMA_TAG:-b11988}
    container_name: ledgerly-llama
    profiles: ["llama-gpu"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - ${LLAMA_MODEL_PATH:-/models/llama-3.1-8b-instruct-q4_k_m.gguf}
      - --alias
      - ${LLAMA_MODEL_ALIAS:-ledgerly-support}
      - -c
      - "${LLAMA_CTX:-32768}"
      - -np
      - "${LLAMA_PARALLEL:-4}"
      - -ngl
      - "${LLAMA_NGL:-99}"
      - -fa
      - "on"
      - -ctk
      - ${LLAMA_CACHE_TYPE_K:-f16}
      - -ctv
      - ${LLAMA_CACHE_TYPE_V:-f16}
      - -ub
      - "${LLAMA_UBATCH:-512}"
      - --cache-reuse
      - "${LLAMA_CACHE_REUSE:-256}"
      - --metrics
      - --api-key
      - ${LLAMA_API_KEY:-llama}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  llama-cpu:
    image: ledgerly/llama-server:cpu-${LLAMA_TAG:-b11988}
    build:
      context: ./ops/llama
      dockerfile: Dockerfile.cpu
      args:
        LLAMA_TAG: ${LLAMA_TAG:-b11988}
    container_name: ledgerly-llama-cpu
    profiles: ["llama-cpu"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - ${LLAMA_CPU_MODEL_PATH:-/models/gemma-3-4b-it-q6_k.gguf}
      - --alias
      - ${LLAMA_MODEL_ALIAS:-ledgerly-support}
      - -c
      - "${LLAMA_CPU_CTX:-16384}"
      - -np
      - "${LLAMA_CPU_PARALLEL:-2}"
      - -ngl
      - "0"
      - -t
      - "${LLAMA_THREADS:-8}"
      - -tb
      - "${LLAMA_THREADS_BATCH:-16}"
      - --metrics
      - --api-key
      - ${LLAMA_API_KEY:-llama}

networks:
  internal:

volumes:
  ledgerly-postgres:
  ledgerly-redis:
  ollama-models:
