services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ledgerly-postgres
    environment:
      POSTGRES_DB: ledgerly
      POSTGRES_USER: ledgerly
      POSTGRES_PASSWORD: ledgerly
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ledgerly-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerly -d ledgerly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ledgerly-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ledgerly-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  sidecar:
    build: ./sidecar
    container_name: ledgerly-sidecar
    ports:
      - "127.0.0.1:8008:8000"
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  ollama:
    image: ollama/ollama:latest
    container_name: ledgerly-ollama
    profiles: ["linux-gpu"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
      - ./ops/ollama:/modelfiles:ro
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  ollama-init:
    image: ollama/ollama:latest
    container_name: ledgerly-ollama-init
    profiles: ["linux-gpu"]
    networks:
      - internal
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./ops/ollama:/modelfiles:ro
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint:
      - sh
      - -c
      - ollama pull nomic-embed-text && ollama pull llama3.1:8b-instruct-q4_K_M && ollama create ledgerly-support -f /modelfiles/Modelfile.ledgerly-support

  llama:
    image: ledgerly/llama-server:cuda-${LLAMA_TAG:-b11988}
    build:
      context: ./ops/llama
      dockerfile: Dockerfile.cuda
      args:
        LLAMA_TAG: ${LLAMA_TAG:-b11988}
    container_name: ledgerly-llama
    profiles: ["llama-gpu"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - ${LLAMA_MODEL_PATH:-/models/llama-3.1-8b-instruct-q4_k_m.gguf}
      - --alias
      - ${LLAMA_MODEL_ALIAS:-ledgerly-support}
      - -c
      - "${LLAMA_CTX:-32768}"
      - -np
      - "${LLAMA_PARALLEL:-4}"
      - -ngl
      - "${LLAMA_NGL:-99}"
      - -fa
      - "on"
      - -ctk
      - ${LLAMA_CACHE_TYPE_K:-f16}
      - -ctv
      - ${LLAMA_CACHE_TYPE_V:-f16}
      - -ub
      - "${LLAMA_UBATCH:-512}"
      - --cache-reuse
      - "${LLAMA_CACHE_REUSE:-256}"
      - --metrics
      - --api-key
      - ${LLAMA_API_KEY:-llama}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:8080/health &&
          curl -sf -H "Authorization: Bearer ${LLAMA_API_KEY:-llama}" -H "Content-Type: application/json"
          -d '{"model":"${LLAMA_MODEL_ALIAS:-ledgerly-support}","messages":[{"role":"user","content":"ok"}],"max_tokens":1}'
          http://localhost:8080/v1/chat/completions > /dev/null
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s

  llama-cpu:
    image: ledgerly/llama-server:cpu-${LLAMA_TAG:-b11988}
    build:
      context: ./ops/llama
      dockerfile: Dockerfile.cpu
      args:
        LLAMA_TAG: ${LLAMA_TAG:-b11988}
    container_name: ledgerly-llama-cpu
    profiles: ["llama-cpu"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${LLAMA_PORT:-8080}:8080"
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - ${LLAMA_CPU_MODEL_PATH:-/models/gemma-3-4b-it-q6_k.gguf}
      - --alias
      - ${LLAMA_MODEL_ALIAS:-ledgerly-support}
      - -c
      - "${LLAMA_CPU_CTX:-16384}"
      - -np
      - "${LLAMA_CPU_PARALLEL:-2}"
      - -ngl
      - "0"
      - -t
      - "${LLAMA_THREADS:-8}"
      - -tb
      - "${LLAMA_THREADS_BATCH:-16}"
      - --metrics
      - --api-key
      - ${LLAMA_API_KEY:-llama}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:8080/health &&
          curl -sf -H "Authorization: Bearer ${LLAMA_API_KEY:-llama}" -H "Content-Type: application/json"
          -d '{"model":"${LLAMA_MODEL_ALIAS:-ledgerly-support}","messages":[{"role":"user","content":"ok"}],"max_tokens":1}'
          http://localhost:8080/v1/chat/completions > /dev/null
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s

  vllm:
    image: vllm/vllm-openai:${VLLM_TAG:-v0.32.0}
    container_name: ledgerly-vllm
    profiles: ["vllm"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${VLLM_PORT:-8001}:8000"
    ipc: host
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_ALLOW_RUNTIME_LORA_UPDATING: ${VLLM_ALLOW_RUNTIME_LORA_UPDATING:-False}
    volumes:
      - vllm-hf-cache:/root/.cache/huggingface
      - ./adapters:/adapters:ro
    command:
      - --model
      - ${VLLM_MODEL:-neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8}
      - --revision
      - ${VLLM_REVISION:-main}
      - --served-model-name
      - ${VLLM_MODEL_ALIAS:-ledgerly-support}
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.92}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-32}"
      - --tensor-parallel-size
      - "${VLLM_TENSOR_PARALLEL:-1}"
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --enable-auto-tool-choice
      - --tool-call-parser
      - ${VLLM_TOOL_PARSER:-llama3_json}
      - ${VLLM_LORA_FLAG:---no-enable-lora}
      - --max-loras
      - "${VLLM_MAX_LORAS:-4}"
      - --max-lora-rank
      - "${VLLM_MAX_LORA_RANK:-64}"
      - --api-key
      - ${VLLM_API_KEY:-vllm}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -sf http://localhost:8000/health &&
          curl -sf -H "Authorization: Bearer ${VLLM_API_KEY:-vllm}" -H "Content-Type: application/json"
          -d '{"model":"${VLLM_MODEL_ALIAS:-ledgerly-support}","messages":[{"role":"user","content":"ok"}],"max_tokens":1}'
          http://localhost:8000/v1/chat/completions > /dev/null
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 300s

  triton:
    image: nvcr.io/nvidia/tritonserver:${TRITON_TAG:-26.10-vllm-python-py3}
    container_name: ledgerly-triton
    profiles: ["triton"]
    networks:
      - internal
    ports:
      - "127.0.0.1:${TRITON_PORT:-9000}:9000"
      - "127.0.0.1:${TRITON_KSERVE_PORT:-8010}:8000"
    ipc: host
    working_dir: /opt/tritonserver/python/openai
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - triton-hf-cache:/root/.cache/huggingface
      - ./ops/triton/models:/models:ro
    command:
      - python3
      - openai_frontend/main.py
      - --model-repository
      - /models
      - --backend
      - ${TRITON_BACKEND:-vllm}
      - --tokenizer
      - ${TRITON_TOKENIZER:-meta-llama/Llama-3.1-8B-Instruct}
      - --tool-call-parser
      - ${TRITON_TOOL_PARSER:-llama3}
      - --default-max-tokens
      - "${TRITON_DEFAULT_MAX_TOKENS:-512}"
      - --model-control-mode
      - explicit
      - --load-model
      - ${TRITON_LOAD_MODEL:-chat}
      - --openai-restricted-api
      - inference,model-repository
      - ${TRITON_AUTH_HEADER:-x-api-key}
      - ${TRITON_API_KEY:-triton}
      - --enable-kserve-frontends
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json, sys, urllib.request; r = urllib.request.Request('http://localhost:9000/v1/chat/completions', json.dumps({'model': '${TRITON_MODEL_ALIAS:-chat}', 'messages': [{'role': 'user', 'content': 'ok'}], 'max_tokens': 1}).encode(), {'Content-Type': 'application/json', '${TRITON_AUTH_HEADER:-x-api-key}': '${TRITON_API_KEY:-triton}'}); sys.exit(0 if urllib.request.urlopen(r, timeout=30).status == 200 else 1)"
      interval: 30s
      timeout: 40s
      retries: 5
      start_period: 600s

  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.5.0}
    container_name: ledgerly-prometheus
    profiles: ["monitoring"]
    networks:
      - internal
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-12.1.0}
    container_name: ledgerly-grafana
    profiles: ["monitoring"]
    networks:
      - internal
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-ledgerly}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./ops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

networks:
  internal:

volumes:
  ledgerly-postgres:
  ledgerly-redis:
  ollama-models:
  vllm-hf-cache:
  triton-hf-cache:
  prometheus-data:
  grafana-data:
